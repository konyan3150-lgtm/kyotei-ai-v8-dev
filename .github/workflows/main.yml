# Source build: V8 DEV 173 bets above venue traits
name: Deploy V8 Dev Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
      - "results.html"
      - "results.css"
      - "results.mjs"
      - "selection-analysis.mjs"
      - "selection.css"
      - "tests/selection-analysis.mjs"
      - "tests/results-browser.cjs"
      - "validation.html"
      - "validation.css"
      - "validation.mjs"
      - "tests/validation-browser.cjs"
      - "tests/prediction-integrity.cjs"
      - "tests/money-integrity.cjs"
      - "overrides/server-sync.js"
      - "overrides/record-audit.js"
      - "tests/record-audit.cjs"
      - "overrides/odds-value.js"
      - "overrides/recommendation.js"
      - "overrides/value-record-state.js"
      - "tests/value-record-state.cjs"
      - "overrides/app2.js"
      - "tests/data-refresh.cjs"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download latest V8 development branch
        run: |
          curl -L --fail -o /tmp/dev.zip "https://github.com/konyan3150-lgtm/kyotei-ai-v8-live/archive/refs/heads/dev-prob-calibration.zip"
          unzip -q /tmp/dev.zip -d /tmp/devsrc
          mkdir -p site
          cp -a /tmp/devsrc/kyotei-ai-v8-live-dev-prob-calibration/. site/

      - name: Add development validation screen
        run: |
          cp validation.html validation.css validation.mjs results.html results.css results.mjs site/
          cp selection-analysis.mjs selection.css site/
          cp overrides/server-sync.js overrides/odds-value.js overrides/recommendation.js overrides/value-record-state.js site/
          cp overrides/app2.js site/
          cp overrides/record-audit.js site/
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          if 'src="odds-value.js' not in s:
              raise RuntimeError('Odds script injection point missing')
          s = s.replace('src="odds-value.js', 'src="odds-value.js?value-state-20261004&', 1)
          s = s.replace('src="recommendation.js', 'src="recommendation.js?value-state-20261004&', 1)
          s = s.replace('<script src="odds-value.js', '<script src="value-record-state.js?value-state-20261004"></script><script src="odds-value.js', 1)
          s = s.replace('server-sync.js?', 'server-sync.js?dev-integrity-20261004-value-state&')
          s = s.replace('src="app2.js?', 'src="app2.js?program-date-20261007&')
          s = s.replace('src="app2.js?', 'src="app2.js?load-time-20261007&')
          s = s.replace('server-sync.js?', 'server-sync.js?archive-timeout-20261007&')
          s = s.replace('server-sync.js?', 'server-sync.js?refresh-20261006&')
          for asset in ['server-sync.js', 'odds-value.js', 'recommendation.js']:
              s = s.replace('src="' + asset + '?', 'src="' + asset + '?money-integrity-20261007&')
          marker = '<div class="pickerpanel">'
          link = '<p style="margin:6px 0 12px;text-align:right"><a href="results.html" style="color:#dfc4ff;font-size:15px;text-decoration:none;margin-right:16px">的中結果一覧 ↗</a><a href="validation.html" style="color:#a8caff;font-size:13px;text-decoration:none">開発検証・収集状況 ↗</a></p>'
          if marker not in s:
              raise RuntimeError('Development homepage insertion point missing')
          p.write_text(s.replace(marker, link + marker, 1))
          PYTHON

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check mobile validation page and interactions
        run: |
          node tests/prediction-integrity.cjs site/server-sync.js
          node tests/money-integrity.cjs site
          node tests/value-record-state.cjs site
          node tests/data-refresh.cjs site
          node experiments/test_collection_daily.mjs
          node experiments/test_collection_diagnostics.mjs
          node tests/record-audit.cjs site/record-audit.js
          node tests/selection-analysis.mjs
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory site > /tmp/validation-server.log 2>&1 &
          node tests/validation-browser.cjs
          node tests/results-browser.cjs

      - name: Preserve UI check screenshots
        uses: actions/upload-artifact@v4
        with:
          name: validation-ui-check-${{ github.run_attempt }}
          path: ui-screenshots/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload development site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
