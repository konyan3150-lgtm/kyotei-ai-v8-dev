name: V8 Migration Safety (staging only)
on:
  workflow_dispatch:
  push:
    branches:
      - migration/stage-live-cutover-20261009
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  migration-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify migration safety invariants
        run: |
          node --check overrides/server-sync.js
          node --check tests/production-cutover-guards.test.mjs
          node --check scripts/production-history-totals.mjs
          node --check scripts/check-production-baseline.mjs
          node --test tests/production-cutover-guards.test.mjs
      - name: Fetch frozen production history snapshot (read-only)
        run: |
          set -euo pipefail
          root='https://raw.githubusercontent.com/konyan3150-lgtm/kyotei-ai-v8-live/c97667ed28ba764abf50542c521d507eea166f03/dev'
          mkdir -p /tmp/v8-live-audit/server-predictions-archive
          for file in server-predictions.json server-predictions-index.json server-predictions-archive/202609.json server-predictions-archive/202610.json; do
            curl --fail --location --retry 3 --silent --show-error "$root/$file" -o "/tmp/v8-live-audit/$file"
            test -s "/tmp/v8-live-audit/$file"
          done
      - name: Audit archive counts and monetary fields
        run: node scripts/audit-production-history.mjs /tmp/v8-live-audit
      - name: Compute historical investment and payout totals
        run: node scripts/production-history-totals.mjs /tmp/v8-live-audit | tee "$RUNNER_TEMP/production-history-totals.json"
      - name: Enforce frozen historical totals and checksum
        run: node scripts/check-production-baseline.mjs "$RUNNER_TEMP/production-history-totals.json"
      - name: Upload audit baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-history-totals
          path: ${{ runner.temp }}/production-history-totals.json
          retention-days: 30
      - name: Report
        if: always()
        run: |
          echo '### V8 migration guard check' >> "$GITHUB_STEP_SUMMARY"
          echo 'Read-only historical audit against frozen production SHA c97667ed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production deployment or production data writes performed.' >> "$GITHUB_STEP_SUMMARY"
