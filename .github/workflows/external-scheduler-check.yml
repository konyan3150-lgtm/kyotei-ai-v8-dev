name: Check external DEV scheduler gates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ops/external-scheduler/**", ".github/workflows/external-scheduler-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node ops/external-scheduler/test.mjs
