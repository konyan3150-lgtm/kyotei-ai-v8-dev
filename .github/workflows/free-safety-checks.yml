name: V8 Free Safety Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  safety-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            echo "Manual run: no PR base to compare; skipping diff check"
          fi
      - name: Validate tracked JSON files
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          errors = []
          for f in files:
              if not f.endswith('.json') or not f:
                  continue
              try:
                  with open(f, encoding='utf-8') as fh:
                      json.load(fh)
              except Exception as exc:
                  errors.append(f'{f}: {exc}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Tracked JSON syntax check passed')
          PY
      - name: Detect unresolved merge markers in source files
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          extensions = {'.js', '.mjs', '.cjs', '.json', '.html', '.css', '.py', '.yml', '.yaml'}
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8', 'surrogateescape').split('\0')
          errors = []
          for name in paths:
              if not name or pathlib.Path(name).suffix.lower() not in extensions:
                  continue
              try:
                  with open(name, encoding='utf-8') as stream:
                      for line_number, line in enumerate(stream, 1):
                          if line.startswith(('<<<<<<< ', '=======', '>>>>>>> ')):
                              errors.append(f'{name}:{line_number}: unresolved merge marker')
              except (UnicodeError, OSError) as exc:
                  errors.append(f'{name}: {exc}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('No unresolved merge markers in tracked source files')
          PY
      - name: Protect Expert shadow archive files from deletion
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          deleted="$(git diff --name-only --diff-filter=D "$base" HEAD -- 'dev/expert-shadow-archive/*.json')"
          if [[ -n "$deleted" ]]; then
            echo "::error::Expert shadow archive deletion blocked:"
            echo "$deleted"
            exit 1
          fi
          echo "No Expert shadow archive JSON files deleted"
      - name: Validate Expert shadow evaluation accounting
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math, pathlib, sys
          path = pathlib.Path('dev/expert-shadow-evaluation.json')
          if not path.exists():
              print('Expert evaluation file absent; skipping optional check')
              sys.exit(0)
          data = json.loads(path.read_text(encoding='utf-8'))
          errors = []
          for name, arm in data.get('value_arms', {}).items():
              if not isinstance(arm, dict):
                  errors.append(f'{name}: invalid arm')
                  continue
              for key in ('eligible_races', 'bought_races', 'skipped_races', 'hits', 'investment', 'payout'):
                  value = arm.get(key)
                  if not isinstance(value, (int, float)) or isinstance(value, bool) or not math.isfinite(value) or value < 0:
                      errors.append(f'{name}: invalid {key}')
              if any(f'{name}: invalid {key}' in errors for key in ('eligible_races', 'bought_races', 'skipped_races', 'hits', 'investment', 'payout')):
                  continue
              if arm['bought_races'] + arm['skipped_races'] != arm['eligible_races']:
                  errors.append(f'{name}: race accounting mismatch')
              if arm['hits'] > arm['bought_races']:
                  errors.append(f'{name}: hits exceed bought races')
              investment = arm['investment']
              roi = arm.get('roi')
              if investment > 0 and (not isinstance(roi, (int, float)) or not math.isclose(roi, arm['payout']/investment, rel_tol=1e-6)):
                  errors.append(f'{name}: ROI does not match payout / investment')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Expert shadow accounting passed')
          PY
