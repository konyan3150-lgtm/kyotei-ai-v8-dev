name: V8 Free Safety Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  safety-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            echo "Manual run: no PR base to compare; skipping diff check"
          fi
      - name: Validate tracked JSON files
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          errors = []
          for f in files:
              if not f.endswith('.json') or not f:
                  continue
              try:
                  with open(f, encoding='utf-8') as fh:
                      json.load(fh)
              except Exception as exc:
                  errors.append(f'{f}: {exc}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Tracked JSON syntax check passed')
          PY
