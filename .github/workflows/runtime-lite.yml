name: DEV light racer data for page load
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 22-23,0-11 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/runtime-lite.yml", "ops/runtime-lite/**"]
permissions:
  contents: write
concurrency:
  group: runtime-lite
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node ops/runtime-lite/test.mjs
      - name: Build today's light file (verifies identical values before writing)
        run: node ops/runtime-lite/build_aptitude_today.mjs
      - name: Save DEV data only
        run: |
          f=dev/runtime-lite/racer-aptitude-today.json.gz
          [ -f "$f" ] || exit 0
          git add "$f"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update DEV light racer data for today"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
