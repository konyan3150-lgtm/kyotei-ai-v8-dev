name: Long-run trifecta popularity check from official K files
on:
  workflow_dispatch:
    inputs:
      start:
        description: First date (YYYYMMDD)
        default: "20210401"
      end:
        description: Last date (YYYYMMDD)
        default: "20260930"
  push:
    branches: [main]
    paths: [".github/workflows/trifecta-popularity.yml", "experiments/trifecta_popularity.py", "experiments/test_trifecta_popularity.py"]
permissions:
  contents: write
concurrency:
  group: trifecta-popularity
  cancel-in-progress: false
jobs:
  popularity:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lhafile==0.3.1
      - uses: actions/cache@v4
        with:
          path: /tmp/official-aptitude-cache
          key: official-k-popularity-${{ inputs.start || '20210401' }}-${{ inputs.end || '20260930' }}-v1
          restore-keys: |
            official-k-popularity-
            official-aptitude-
      - name: Test parser
        run: python -m unittest discover -s experiments -p test_trifecta_popularity.py
      - name: Collect official K files and summarize (read-only research)
        run: python experiments/trifecta_popularity.py --start "${{ inputs.start || '20210401' }}" --end "${{ inputs.end || '20260930' }}"
      - name: Check parse coverage
        run: |
          python - <<'PY'
          import json
          x=json.load(open('dev/trifecta-popularity/summary.json'))
          total=x['races']+x['excluded_races']
          print({k:x[k] for k in ['days_with_source','source_failures','races','excluded_races']})
          if not x['races'] or x['excluded_races']>0.05*total:
              raise SystemExit('Too many excluded races: parser may not match the official format. Nothing committed.')
          PY
      - name: Save research data only
        run: |
          git add dev/trifecta-popularity/races.csv.gz dev/trifecta-popularity/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save long-run trifecta popularity research summary"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Keep outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trifecta-popularity-${{ github.run_id }}
          path: dev/trifecta-popularity
          retention-days: 7
