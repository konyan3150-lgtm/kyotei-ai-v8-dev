name: Collect repaired-input prospective Expert predictions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["experiments/odds_deterioration.mjs", "experiments/test_odds_deterioration.mjs", "experiments/learning_inputs.mjs", "experiments/test_learning_inputs.mjs", "experiments/recent_player_features.py", "experiments/test_recent_player_features.py", "experiments/build_recent_player_input.py", "experiments/test_build_recent_player_input.py", "experiments/realtime_shadow.mjs", "experiments/odds_calibration.mjs", "experiments/test_odds_calibration.mjs", "experiments/odds_diagnostics.mjs", "experiments/test_odds_diagnostics.mjs", "selection-analysis.mjs", "tests/selection-analysis.mjs", "experiments/collection_diagnostics.mjs", "experiments/test_collection_diagnostics.mjs", "experiments/variant_risk.mjs", "experiments/collection_daily.mjs", "experiments/test_collection_daily.mjs", ".github/workflows/repaired-expert-shadow.yml", "experiments/run_shadow_cycles.mjs", "experiments/test_run_shadow_cycles.mjs", "experiments/repaired_expert_shadow.mjs", "experiments/prospective_input.mjs", "experiments/official_result_fallback.mjs", "experiments/test_official_result_fallback.mjs", "experiments/refresh_prospective_aptitude.py", "experiments/test_prospective_input.mjs", "experiments/test_refresh_prospective_aptitude.py", "experiments/preclose_variants.mjs", "experiments/test_preclose_variants.mjs", "experiments/prospective_calibration.mjs", "experiments/test_prospective_calibration.mjs"]
  schedule:
    - cron: "2-59/5 * * * *"
permissions:
  contents: write
concurrency:
  group: repaired-expert-shadow
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lhafile==0.3.1
      - name: Test shadow gates
        run: |
          node experiments/test_odds_deterioration.mjs
          python -m unittest discover -s experiments -p test_recent_player_features.py
          python -m unittest discover -s experiments -p test_build_recent_player_input.py
          node experiments/test_learning_inputs.mjs
          node experiments/test_odds_calibration.mjs
          node experiments/test_robust_ev.mjs
          node experiments/test_odds_diagnostics.mjs
          node tests/selection-analysis.mjs
          node experiments/test_collection_diagnostics.mjs
          node experiments/test_collection_daily.mjs
          python -m unittest discover -s experiments -p test_refresh_prospective_aptitude.py
          node experiments/test_official_result_fallback.mjs
          node experiments/test_prospective_input.mjs
          node experiments/test_preclose_variants.mjs
          node experiments/test_prospective_calibration.mjs
          node experiments/test_expert_shadow.mjs
          node experiments/test_ev_drift.mjs
          node experiments/test_realtime_shadow.mjs
          node experiments/test_shadow_diagnostics.mjs
          node experiments/test_exhibition_health.mjs
          node experiments/test_run_shadow_cycles.mjs
      - name: Prepare frozen prediction engine and latest auxiliary data
        run: |
          git clone --depth 1 https://github.com/konyan3150-lgtm/kyotei-ai-v8-live.git /tmp/live-data
          git -C /tmp/live-data fetch --depth 1 origin 8286a9783a7799aacade7d0f0de72e8636a681ac
          git -C /tmp/live-data show 8286a9783a7799aacade7d0f0de72e8636a681ac:scripts/update_server_predictions.mjs > /tmp/live-data/scripts/update_server_predictions.mjs
          git -C /tmp/live-data show 8286a9783a7799aacade7d0f0de72e8636a681ac:scripts/racer_aptitude_features.mjs > /tmp/live-data/scripts/racer_aptitude_features.mjs
          git -C /tmp/live-data show 8286a9783a7799aacade7d0f0de72e8636a681ac:v8_model_aptitude.json > /tmp/live-data/v8_model_aptitude.json
          curl -L --fail -o /tmp/expert-classifier-v2.js https://raw.githubusercontent.com/konyan3150-lgtm/kyotei-ai-v8-live/6c7f1841cb8fc9611a6c6f2dabe2d0135b0a671b/expert-classifier-v2.js
      - name: Refresh official history through yesterday
        run: python experiments/refresh_prospective_aptitude.py
      - name: Prepare recent-player learning inputs
        continue-on-error: true
        run: python experiments/build_recent_player_input.py --out /tmp/recent-player-input.json
      - name: Collect and checkpoint three bounded passes
        env:
          TZ: Asia/Tokyo
          ENGINE_ROOT: /tmp/live-data
          CLASSIFIER_PATH: /tmp/expert-classifier-v2.js
          SHADOW_ROOT: ${{ github.workspace }}
        run: node experiments/run_shadow_cycles.mjs
      - name: Preserve collection diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-collection-diagnostics
          path: dev/shadow-collection-run.json
          if-no-files-found: ignore



