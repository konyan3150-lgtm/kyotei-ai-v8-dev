name: Journal storage service check (isolated)
# Isolated check, on GitHub, of the journal storage used by the production update workflow:
# 1) artifacts: does a re-run keep the earlier attempt's artifact? (result: no -> not used)
# 2) git branch ops/preclose-journal: save -> restore in a re-run of the same run.
# Runs only on this branch of the DEV repository; touches no production data.
on:
  push:
    branches: [journal-artifact-check]
    paths: [".github/workflows/journal-artifact-check.yml", "journal-check/**"]
permissions:
  contents: write
  actions: read
jobs:
  check:
    if: github.ref == 'refs/heads/journal-artifact-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Restore from the journal branch
        id: restore
        run: node journal-check/journal_store.mjs restore "$RUNNER_TEMP/v8-journal/preclose-journal.json"
      - name: Earlier attempts of this run must be restored
        run: |
          node --input-type=module -e "
          import {readJournal} from './journal-check/carry_preclose_saves.mjs';
          const j=readJournal(process.env.RUNNER_TEMP+'/v8-journal/preclose-journal.json'),keys=Object.keys(j.entries);console.log('restored keys',keys);
          for(let a=1;a<Number(process.env.GITHUB_RUN_ATTEMPT);a++){const k='check-'+process.env.GITHUB_RUN_ID+'-'+a;if(!keys.includes(k)){console.error('missing',k);process.exit(1);}}"
      - name: Add an entry for this attempt
        run: |
          node --input-type=module -e "
          import {readJournal,writeJournal} from './journal-check/carry_preclose_saves.mjs';
          const f=process.env.RUNNER_TEMP+'/v8-journal/preclose-journal.json',j=readJournal(f);j.entries['check-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT]={type:'record',snapshot:{note:'service check'},captured_at:new Date().toISOString()};writeJournal(f,j);"
      - name: Save to the journal branch (read back from origin)
        if: always() && steps.restore.outcome == 'success'
        run: node journal-check/journal_store.mjs save "$RUNNER_TEMP/v8-journal/preclose-journal.json"
