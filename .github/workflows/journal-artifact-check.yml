name: Journal artifact service check (isolated)
# Isolated check of the production journal artifact flow on GitHub's service: unique names per run attempt,
# upload -> download (restore) -> re-run of the same run. Runs only on this branch; touches no production data.
on:
  push:
    branches: [journal-artifact-check]
    paths: [".github/workflows/journal-artifact-check.yml", "journal-check/**"]
permissions:
  contents: read
  actions: read
jobs:
  check:
    if: github.ref == 'refs/heads/journal-artifact-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      JOURNAL_WORKFLOW_PATH: .github/workflows/journal-artifact-check.yml
      JOURNAL_BRANCH: journal-artifact-check
      J: ${{ runner.temp }}/v8-journal/preclose-journal.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Restore (union of earlier journal artifacts of this workflow)
        run: node journal-check/journal_store.mjs restore "$J"
      - name: Previous attempts' journals must be restored
        run: |
          node --input-type=module -e "
          import {readJournal} from './journal-check/carry_preclose_saves.mjs';
          const j=readJournal(process.env.J),keys=Object.keys(j.entries);console.log('restored keys',keys);
          for(let a=1;a<Number(process.env.GITHUB_RUN_ATTEMPT);a++){const k='check-'+process.env.GITHUB_RUN_ID+'-'+a;if(!keys.includes(k)){console.error('missing',k);process.exit(1);}}"
      - name: Add an entry for this attempt
        run: |
          node --input-type=module -e "
          import {readJournal,writeJournal} from './journal-check/carry_preclose_saves.mjs';
          const j=readJournal(process.env.J);j.entries['check-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT]={type:'record',snapshot:{note:'service check'},captured_at:new Date().toISOString()};writeJournal(process.env.J,j);"
      - name: Status
        id: journal
        if: always()
        run: node journal-check/journal_store.mjs status "$J"
      - name: Upload (unique name per attempt)
        if: always() && steps.journal.outputs.keep != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.journal.outputs.name || format('preclose-journal-{0}-{1}', github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/v8-journal/preclose-journal.json
          retention-days: 1
          if-no-files-found: error
